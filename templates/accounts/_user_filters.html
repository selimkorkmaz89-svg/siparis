{% load i18n %}
<label>{% translate "Role" %}
  <select name="role">
    <option value="">{% translate "All" %}</option>
    {% for value, label in roles %}<option value="{{ value }}" {% if selected_role == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
</label>
<label>{% translate "Status" %}
  <select name="status">
    <option value="">{% translate "All" %}</option>
    {% for value, label in statuses %}<option value="{{ value }}" {% if selected_status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
</label>
